/a><div class="nav-actions"><button class="icon-button" data-theme-toggle>◐</button><a class="text-link" href="/login.html">Organization sign in</a></div></header><main class="verify-main"><section class="verify-intro"><span class="eyebrow accent">CREDENTIAL VERIFICATION</span><h1>Verify a certificate</h1><p>Enter the certificate ID to confirm its authenticity and issuing organization.</p><form id="verify-form" class="verify-form"><label for="certificate-id">Certificate ID</label><div><input id="certificate-id" required autocomplete="off" placeholder="CERT-2026-X7F8K92M"><button class="button">Verify Certificate</button></div><small>Tip: Certificate IDs are case-insensitive.</small></form></section><section id="verification-result" hidden aria-live="polite"></section></main><footer><a class="brand" href="/"><i>✓</i> CertiVerify</a><span>Independent credential verification</span></footer></body></html>
