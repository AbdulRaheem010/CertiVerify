<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate — CertiVerify</title><link rel="stylesheet" href="/css/style.css"><style>.credential-detail{overflow:hidden}.certificate-preview{width:100%;background:#111;border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;min-height:520px}.certificate-preview iframe{display:block;width:100%;height:70vh;min-height:520px;border:0;background:#fff}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden}.detail-grid article{background:#111915;padding:18px;min-width:0}.detail-grid small{display:block;opacity:.65;margin-bottom:7px}.detail-grid strong{display:block;overflow-wrap:anywhere}.history-list{display:grid;gap:8px}.history-list>div{display:flex;justify-content:space-between;gap:20px;padding:14px 16px;border:1px solid rgba(255,255,255,.1);border-radius:10px}.history-list strong{overflow-wrap:anywhere}@media(max-width:800px){.workspace-page{padding:24px 16px}.workspace-heading{gap:18px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.certificate-preview iframe{height:55vh;min-height:360px}}@media(max-width:520px){.detail-grid{grid-template-columns:1fr}.certificate-preview iframe{height:48vh;min-height:300px}.card-actions{flex-wrap:wrap}.card-actions .button{flex:1 1 100%;text-align:center}.history-list>div{display:block}.history-list strong{display:block;margin-top:6px}}</style><script type="module" src="/js/app.js"></script><script type="module" src="/js/holder-certificate.js"></script></head><body class="app-page"><main class="workspace-page"><a class="brand" href="/my-certificates.html"><i>✓</i> CertiVerify</a><header class="workspace-heading"><div><span class="eyebrow accent">MY CREDENTIAL</span><h1 id="title">Certificate</h1><p id="subtitle">Your verified achievement.</p></div><div class="card-actions"><a class="button secondary" href="/my-certificates.html">Back to credentials</a><a id="download" class="button" href="#">Download PDF</a></div></header><p id="page-error" class="error-text"></p><section class="dashboard-section credential-detail"><div class="certificate-preview"><iframe id="preview" title="Certificate preview" loading="lazy"></iframe></div><div class="detail-grid"><article><small>Recipient</small><strong id="recipient">—</strong></article><article><small>Organization</small><strong id="organization">—</strong></article><article><small>Course</small><strong id="course">—</strong></article><article><small>Status</small><strong id="status">—</strong></article><article><small>Issue date</small><strong id="issue-date">—</strong></article><article><small>Expiry date</small><strong id="expiry-date">—</strong></article><article><small>Certificate ID</small><strong id="certificate-id">—</strong></article><article><small>Version</small><strong id="version">—</strong></article></div><div id="history" class="dashboard-section"></div></section></main></body></html>
