<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — CertiVerify</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/app.js"></script><script type="module" src="/js/password-reset.js"></script></head>
<body class="auth-page"><a class="brand auth-brand" href="/"><i>✓</i> CertiVerify</a><main class="auth-card"><span class="eyebrow accent">SECURE ACCOUNT RECOVERY</span><h1>Choose a new password</h1><p>Use at least 12 characters. Reset links expire after 30 minutes and can only be used once.</p><form id="reset-password-form"><label>New password<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="At least 12 characters"></label><label>Confirm new password<input type="password" name="confirmPassword" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="Enter the password again"></label><p id="reset-message" role="status" aria-live="polite"></p><button class="button wide" type="submit">Update password</button></form><p class="auth-switch"><a href="/login.html">Back to sign in</a></p></main></body></html>
